# Builds the workflow image with the vrsify dependencies (see misc/bin/build-vrsify-image.sh).
# Tagged separately from the images the Cloud Run jobs are deployed with.
steps:
- name: 'gcr.io/kaniko-project/executor:v1.3.0'
  args:
  - --destination=gcr.io/clingen-dev/clinvar-ingest:vrsify-${COMMIT_SHA}
  - --dockerfile=Dockerfile-workflow-py
  - --build-arg=PIP_EXTRAS=[vrsify]
  - --cache=true
  - --cache-ttl=168h

# Compiling gtars (Rust) and psycopg2 from source dominates a build whose dependency layer
# is not cached; cargo compiles crates in parallel, so a build gains from more cores
options:
  machineType: E2_HIGHCPU_8
timeout: 3600s
